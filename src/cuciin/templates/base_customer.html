<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}cuciin{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #eef6fb; color: #1a3a5c; }
        .container { max-width: 720px; margin: 24px auto; padding: 0 16px; }
        .panel { background: #fff; border: 1px solid #b8d8ec; border-radius: 8px; overflow: hidden; }
        .panel-header { padding: 12px 16px; background: #d8ecf8; font-weight: bold; }
        .panel-body { padding: 16px; }
        .btn { display: inline-block; padding: 9px 14px; border: 1px solid #5a9fd4; border-radius: 6px; background: #fff; color: #1a3a5c; text-decoration: none; cursor: pointer; }
        .btn-green { background: #58a858; border-color: #4a904a; color: #fff; }
        .btn-secondary { background: #eef6fb; }
        .btn-small { padding: 6px 10px; font-size: 12px; }
        .flash { padding: 10px; margin-bottom: 12px; border-radius: 6px; }
        .flash-success { background: #d8f8d8; }
        .flash-error { background: #f8d8d8; }
        .flash-warning { background: #f8f0d8; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 10px; background: #d8ecf8; }
        .badge-diproses { background: #f8f0d8; }
        .badge-selesai { background: #d8f8d8; }
        .badge-lunas { background: #d8f8d8; }
        .badge-belum { background: #f8d8d8; }
        .badge-rak { background: #e8d8f8; }
        .empty { text-align: center; color: #6d8298; }
    </style>
</head>
<body>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
