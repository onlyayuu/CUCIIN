<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>tambah order — cuciin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 500px; width: 100%; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 32px; font-size: 0.9rem; }
        form { display: flex; flex-direction: column; gap: 16px; }
        label { font-size: 0.85rem; color: #999; margin-bottom: 6px; display: block; }
        input, select {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            color: #e5e5e5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #444;
        }
        .actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn {
            flex: 1;
            background: #fff;
            color: #000;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { opacity: 0.8; }
        .btn-secondary {
            background: transparent;
            color: #e5e5e5;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>tambah order</h1>
        <p class="subtitle">isi data pelanggan</p>

        <form method="POST">
            <div>
                <label>nama</label>
                <input type="text" name="nama" required autofocus>
            </div>
            <div>
                <label>no hp (opsional)</label>
                <input type="text" name="no_hp">
            </div>
            <div>
                <label>berat (kg)</label>
                <input type="number" name="berat" step="0.1" min="0.1" required>
            </div>
            <div>
                <label>layanan</label>
                <select name="layanan" required>
                    {% for nama, harga in layanan.items() %}
                    <option value="{{ nama }}">{{ nama }} — Rp{{ "{:,}".format(harga) }}/kg</option>
                    {% endfor %}
                </select>
            </div>
            <div class="actions">
                <a href="/" class="btn btn-secondary">batal</a>
                <button type="submit" class="btn">simpan</button>
            </div>
        </form>
    </div>
</body>
</html>
