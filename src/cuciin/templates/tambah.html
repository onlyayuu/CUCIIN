{% extends "base_customer.html" %}
{% block title %}tambah pesanan — cuciin{% endblock %}
{% block content %}
<section class="panel">
    <div class="panel-header">Tambah Pesanan</div>
    <div class="panel-body">
        <form method="post" action="/tambah">
            <div style="margin-bottom:12px;">
                <label for="nama">Nama pelanggan</label><br>
                <input id="nama" name="nama" type="text" required style="width:100%;padding:8px;">
            </div>
            <div style="margin-bottom:12px;">
                <label for="no_hp">Nomor HP</label><br>
                <input id="no_hp" name="no_hp" type="text" style="width:100%;padding:8px;">
            </div>
            <div style="margin-bottom:12px;">
                <label for="berat">Berat (kg)</label><br>
                <input id="berat" name="berat" type="number" min="0.1" step="0.1" required style="width:100%;padding:8px;">
            </div>
            <div style="margin-bottom:12px;">
                <label for="layanan">Layanan</label><br>
                <select id="layanan" name="layanan" required style="width:100%;padding:8px;">
                    {% for nama in layanan %}
                    <option value="{{ nama }}">{{ nama }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-green">Simpan Pesanan</button>
            <a href="/" class="btn">Batal</a>
        </form>
    </div>
</section>
{% endblock %}
