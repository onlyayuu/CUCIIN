{% extends "base_customer.html" %}
{% block title %}cek pesanan — cuciin{% endblock %}
{% block content %}
<section class="panel">
    <div class="panel-header">Cek Status Pesanan</div>
    <div class="panel-body">
        <form method="post" action="/cek">
            <label for="keyword">Nomor HP atau nomor nota</label>
            <input id="keyword" name="keyword" type="text" required style="width:100%;padding:10px;margin:8px 0 12px;">
            <button type="submit" class="btn btn-green">Cek Pesanan</button>
            <a href="/tambah" class="btn">Tambah Pesanan</a>
        </form>
    </div>
</section>
{% endblock %}
