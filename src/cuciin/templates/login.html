{% extends "base_customer.html" %}
{% block title %}login admin — cuciin{% endblock %}

{% block content %}
<style>
    .login-card {
        max-width: 420px;
        margin: 48px auto;
    }
    .login-intro {
        margin: 0 0 20px;
        color: #4a7fb0;
        line-height: 1.6;
    }
    .login-field {
        margin-bottom: 16px;
    }
    .login-field label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
    }
    .login-field input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #7eb8e0;
        border-radius: 5px;
        background: #fff;
        color: #1a3a5c;
        font: inherit;
    }
    .login-field input:focus {
        outline: 2px solid #5a9fd4;
        outline-offset: 2px;
    }
    .login-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
    }
    @media (max-width: 480px) {
        .login-card { margin: 24px auto; }
        .login-actions { align-items: stretch; flex-direction: column; }
    }
</style>

<section class="panel login-card" aria-labelledby="login-title">
    <div class="panel-header" id="login-title">Login Admin</div>
    <div class="panel-body">
        <p class="login-intro">Masuk untuk mengelola pesanan cuciin.</p>
        <form method="post" action="/admin/login">
            <div class="login-field">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>
            <div class="login-field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>
            <div class="login-actions">
                <a href="/" class="btn btn-secondary">Kembali</a>
                <button type="submit" class="btn btn-green">Masuk</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
